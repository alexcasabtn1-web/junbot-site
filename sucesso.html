<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Conta Liberada</title>
</head>
<body>
  <h1>Dados da Conta</h1>
  <button onclick="buscarConta()">Ver Conta</button>

  <div id="dados"></div>

  <script>
    async function buscarConta() {
      const res = await fetch("http://localhost:3000/conta");
      const data = await res.json();

      if (data.usuario) {
        document.getElementById("dados").innerHTML = `
          <p><strong>Usuário:</strong> ${data.usuario}</p>
          <p><strong>Senha:</strong> ${data.senha}</p>
        `;
      } else {
        document.getElementById("dados").innerHTML = "Conta indisponível.";
      }
    }
  </script>
</body>
</html>
