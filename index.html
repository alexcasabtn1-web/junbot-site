<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Minha IA</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: white;
      text-align: center;
    }

    header {
      padding: 60px 20px;
    }

    h1 {
      font-size: 40px;
      margin-bottom: 10px;
    }

    p {
      font-size: 18px;
      color: #cbd5e1;
    }

    .box {
      margin: 40px auto;
      max-width: 500px;
      background: #111827;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(0,0,0,0.4);
    }

    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 20px;
      background: #3b82f6;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      transition: 0.2s;
    }

    .btn:hover {
      background: #2563eb;
    }

    footer {
      margin-top: 50px;
      font-size: 14px;
      color: #94a3b8;
    }
  </style>
</head>

<body>

  <header>
    <h1>🤖 Minha IA</h1>
    <p>Uma inteligência criada por mim que ainda está em evolução 🚀</p>
  </header>

  <div class="box">
    <h2>Sobre</h2>
    <p>
      Essa IA está sendo desenvolvida para responder perguntas,
      aprender novas funções e evoluir com o tempo.
    </p>

    <a class="btn" href="#">Testar (em breve)</a>
  </div>

  <footer>
    Feito por você 😎
  </footer>

</body>
</html>
