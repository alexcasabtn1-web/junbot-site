<script>
window.onload = async () => {
  const box = document.getElementById("resposta");

  box.innerHTML = "🤖 Iniciando JunBot...";

  const res = await fetch("https://SEU_BACKEND/ia", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({text: "Diga olá ao usuário"})
  });

  const data = await res.json();

  box.innerHTML = `
    <h3>JunBot diz:</h3>
    <p>${data.texto}</p>
    <img src="${data.imagem}">
  `;
};
</script>
