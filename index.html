<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loja - Matemática para Anime</title>
</head>
<body>

  <h1>Loja - Matemática para Anime</h1>

  <p><strong>Preço:</strong> R$ 1,00</p>

  <p id="status">
    <strong>Status:</strong> Em estoque
  </p>

  <button id="btnComprar" onclick="comprar()">
    Comprar Conta
  </button>

  <script>
    async function comprar() {
      const res = await fetch("http://localhost:3000/comprar", {
        method: "POST"
      });

      const data = await res.json();

      if (data.status === "aguardando") {
        document.getElementById("status").innerHTML =
          "<strong>Status:</strong> Esgotado";

        document.getElementById("btnComprar").disabled = true;
        document.getElementById("btnComprar").innerText = "Esgotado";

        alert("Compra realizada com sucesso!");

        window.location.href = "sucesso.html";
      } else {
        alert(data.msg);
      }
    }
  </script>

</body>
</html>
