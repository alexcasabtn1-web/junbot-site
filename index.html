<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Rainbow AI</title>

<link rel="stylesheet" href="style.css">

<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

</head>

<body>

<!-- SIDEBAR -->

<div class="inputArea">

<input

id="messageInput"

type="text"

placeholder="Pergunte algo..."

autocomplete="off"

>

<input
type="file"
id="fileInput">

<button
class="sendBtn"
onclick="sendMessage()">

Enviar

</button>

</div>
<!-- NOVA CONVERSA -->

<button
class="newChatBtn"
onclick="newChat()">

+ Nova Conversa

</button>

<!-- LOGIN -->

<button
id="loginBtn"
class="googleBtn"
onclick="loginGoogle()">

<img
src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/google/google-original.svg">

<span>
Entrar com Google
</span>

</button>

<!-- PERFIL -->

<div
id="profile"
class="profile"
style="display:none;">

<img
id="userPhoto"
class="userPhoto">

<div class="profileInfo">

<div id="userName">
Usuário
</div>

<button
class="logoutBtn"
onclick="logout()">

Sair

</button>

</div>

</div>

</div>

<!-- HISTORICO -->

<div
id="historyList"
class="historyList">

</div>

</div>

<!-- MAIN -->

<div class="main">

<!-- CHAT -->

<div
id="chat"
class="chat">

<div class="welcome">

<h1>
Rainbow AI 🌈
</h1>

<p>
Converse gratuitamente com memória inteligente
</p>

</div>

</div>

<!-- INPUT -->

<div class="inputArea">

<input

id="messageInput"

type="text"

placeholder="Pergunte algo para Rainbow AI..."

autocomplete="off"

>

<button
class="sendBtn"
onclick="sendMessage()">

Enviar

</button>

</div>

</div>

<!-- FIREBASE -->

<script src="firebase.js"></script>

<!-- SCRIPT -->

<script src="script.js"></script>

</body>
</html>
