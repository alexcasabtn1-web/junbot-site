<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Jogo de Desenhar</title>

<style>
body{
margin:0;
background:#111;
color:white;
font-family:Arial;
text-align:center;
}

h1{margin:10px;}

.toolbar{
padding:10px;
}

canvas{
border:2px solid white;
background:white;
cursor:crosshair;
}
button, input{
padding:8px;
margin:5px;
border:none;
border-radius:6px;
}
</style>

</head>

<body>

<h1>🎨 Desenhe aqui</h1>

<div class="toolbar">
<input type="color" id="cor" value="#000000">
<button onclick="limpar()">🧹 Limpar</button>
</div>

<canvas id="tela" width="800" height="500"></canvas>

<script>

const canvas = document.getElementById("tela");
const ctx = canvas.getContext("2d");

let desenhando = false;

canvas.addEventListener("mousedown", () => desenhando = true);
canvas.addEventListener("mouseup", () => {
desenhando = false;
ctx.beginPath();
});

canvas.addEventListener("mousemove", desenhar);

function desenhar(e){
if(!desenhando) return;

ctx.lineWidth = 5;
ctx.lineCap = "round";
ctx.strokeStyle = document.getElementById("cor").value;

ctx.lineTo(e.offsetX, e.offsetY);
ctx.stroke();
ctx.beginPath();
ctx.moveTo(e.offsetX, e.offsetY);
}

function limpar(){
ctx.clearRect(0,0,canvas.width,canvas.height);
}

</script>

</body>
</html>
