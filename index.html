<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brinting0AI - Polly AI Clone</title>
    <style>
        :root {
            --bg-dark: #0f0f13;
            --panel-dark: #171721;
            --accent: #bb86fc;
            --text: #e1e1e6;
            --text-muted: #8b8b9d;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            height: 100vh;
        }
        .sidebar {
            width: 320px;
            background-color: var(--panel-dark);
            border-right: 1px solid #292938;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
        }
        h2, h3 {
            margin: 0;
            color: var(--accent);
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        label {
            font-size: 14px;
            color: var(--text-muted);
        }
        input, textarea, select {
            background-color: var(--bg-dark);
            border: 1px solid #292938;
            border-radius: 6px;
            padding: 10px;
            color: var(--text);
            font-size: 14px;
            outline: none;
        }
        input:focus, textarea:focus, select:focus {
            border-color: var(--accent);
        }
        button {
            background-color: var(--accent);
            color: var(--bg-dark);
            border: none;
            border-radius: 6px;
            padding: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover {
            opacity: 0.9;
        }
        .character-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
        }
        .char-card {
            background-color: var(--bg-dark);
            border: 1px solid #292938;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }
        .char-card:hover, .char-card.active {
            border-color: var(--accent);
            background-color: #1a1a26;
        }
        .char-card h4 {
            margin: 0 0 5px 0;
        }
        .char-card p {
            margin: 0;
            font-size: 12px;
            color: var(--text-muted);
        }
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-dark);
        }
        .chat-header {
            background-color: var(--panel-dark);
            padding: 20px;
            border-bottom: 1px solid #292938;
        }
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 8px;
            line-height: 1.4;
        }
        .message.user {
            background-color: var(--accent);
            color: var(--bg-dark);
            align-self: flex-end;
            border-bottom-right-radius: 0;
        }
        .message.ai {
            background-color: var(--panel-dark);
            color: var(--text);
            align-self: flex-start;
            border-bottom-left-radius: 0;
        }
        .chat-input-area {
            padding: 20px;
            background-color: var(--panel-dark);
            border-top: 1px solid #292938;
            display: flex;
            gap: 10px;
        }
        .chat-input-area input {
            flex: 1;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>Polly AI Builder 🔑</h2>
        <p style="font-size: 12px; color: var(--text-muted); margin: 0;">Crie personalidades para rodar no seu computador local.</p>
        
        <div class="form-group">
            <label for="char-name">Nome da IA</label>
            <input type="text" id="char-name" placeholder="Ex: Agostinho Carrara">
        </div>

        <div class="form-group">
            <label for="char-model">Modelo do Ollama</label>
            <select id="char-model">
                <option value="qwen2.5:7b">qwen2.5:7b (Recomendado)</option>
                <option value="llama3:latest">llama3:latest</option>
                <option value="deepseek-r1:32b">deepseek-r1:32b (Lento)</option>
                <option value="phi3:latest">phi3:latest</option>
            </select>
        </div>

        <div class="form-group">
            <label for="char-prompt">Instruções de Personalidade (System Prompt)</label>
            <textarea id="char-prompt" rows="4" placeholder="Diga como a IA deve agir... Ex: Responda usando gírias de carioca e seja muito marrento."></textarea>
        </div>

        <button id="btn-criar">Criar Personagem 🤖</button>

        <hr style="border: 0; border-top: 1px solid #292938; width: 100%;">

        <h3>Suas IAs Criadas</h3>
        <div class="character-list" id="char-list"></div>
    </div>

    <div class="chat-container">
        <div class="chat-header">
            <h2 id="current-char-title">Selecione ou Crie uma IA ao lado</h2>
            <p id="current-char-info" style="margin: 5px 0 0 0; font-size: 13px; color: var(--text-muted);"></p>
        </div>

        <div class="chat-messages" id="chat-box"></div>

        <div class="chat-input-area">
            <input type="text" id="user-input" placeholder="Digite uma mensagem...">
            <button id="btn-enviar">Enviar 🚀</button>
        </div>
    </div>

    <!-- Puxa o script externo com segurança -->
    <script src="script.js"></script>
</body>
</html>
