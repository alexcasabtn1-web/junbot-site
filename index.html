<!-- Cole esse bloco de conteúdo dentro do container do seu site FastAPI -->
<div class="content">
    <h2>🎨 Criar Imagens Via IA (100% Grátis e Ilimitado)</h2>
    <p class="info-p">Digite a sua ideia em inglês para conseguir o melhor resultado hiper-realista:</p>
    
    <input type="text" id="prompt_imagem" placeholder="Ex: A futuristic cyberpunk cat, neon lights, 4k" style="width: 70%; margin-bottom: 15px;">
    <button onclick="gerarImagemFlux()">Gerar Imagem Real 🚀</button>
    
    <!-- Local onde a imagem vai aparecer na tela do usuário -->
    <div id="resultado-imagem" style="margin-top: 20px; display: none; border: 1px solid #30363d; padding: 10px; border-radius: 6px; background: #0d1117;">
        <p style="color: #00ff96; font-weight: bold; margin-bottom: 10px;">Imagem Gerada:</p>
        <img id="img-resultado" src="" alt="Resultado da IA" style="max-width: 100%; border-radius: 6px; border: 1px solid #00ff96;">
    </div>
</div>

<script>
async function gerarImagemFlux() {
    const prompt = document.getElementById('prompt_imagem').value;
    if (!prompt) {
        alert('Digita alguma ideia antes de mandar gerar! 🤠');
        return;
    }
    
    const divResultado = document.getElementById('resultado-imagem');
    const tagImg = document.getElementById('img-resultado');
    
    // Altera o visual para avisar o usuário que a IA está trabalhando
    divResultado.style.display = 'block';
    tagImg.src = '';
    tagImg.alt = 'As supermáquinas da nuvem estão desenhando seu prompt...';
    
    // Codifica o prompt de forma segura para não quebrar a URL
    const promptCodificado = encodeURIComponent(prompt);
    
    // Monta a URL mágica que você descobriu com o modelo FLUX
    const urlFinal = `https://pollinations.ai{promptCodificado}?model=flux&width=1024&height=1024&seed=${Math.floor(Math.random() * 100000)}&nologo=true`;

    
    // Injeta o link direto na imagem. O próprio navegador baixa e renderiza da nuvem deles!
    tagImg.src = urlFinal;
    tagImg.alt = 'Imagem Concluída!';
}
</script>
