<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Key System</title>

<style>
    body {
        background: #0f0f1a;
        color: white;
        font-family: Arial;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .box {
        background: #1c1c2e;
        padding: 20px;
        border-radius: 12px;
        width: 300px;
        box-shadow: 0 0 15px rgba(0,0,0,0.5);
    }

    input {
        width: 100%;
        padding: 8px;
        margin: 8px 0;
        border-radius: 6px;
        border: none;
        outline: none;
    }

    button {
        width: 100%;
        padding: 10px;
        margin-top: 8px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        background: #4c7dff;
        color: white;
        font-weight: bold;
    }

    button:hover {
        background: #3a66d6;
    }

    .label {
        margin-top: 10px;
        font-size: 14px;
        opacity: 0.8;
    }
</style>
</head>

<body>

<div class="box">

    <div class="label">tvVer:</div>
    <input id="tvVer" placeholder="digite test">

    <div class="label">txConta:</div>
    <input id="txConta" placeholder="resultado" readonly>

    <button id="btVer">Verificar</button>

    <hr>

    <div class="label">txVer:</div>
    <input id="txVer" value="oi" readonly>

    <button id="btCopiar">Copiar</button>

</div>

<script>
    // btCopiar copia "oi"
    document.getElementById("btCopiar").onclick = function() {
        navigator.clipboard.writeText("oi");
        alert("Copiado: oi");
    };

    // btVer verifica tvVer
    document.getElementById("btVer").onclick = function() {
        let valor = document.getElementById("tvVer").value;

        if (valor === "test") {
            document.getElementById("txConta").value = "iue";
        } else {
            document.getElementById("txConta").value = "errado";
        }
    };
</script>

</body>
</html>
