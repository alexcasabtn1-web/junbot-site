<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Rainbow AI</title>

<link rel="stylesheet" href="style.css">

<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

</head>

<body>

<!-- SIDEBAR -->

<div class="sidebar">

<h1 class="logo">
Rainbow AI
</h1>

<button
class="newChatBtn"
onclick="newChat()">

+ Nova Conversa

</button>

<!-- LOGIN -->

<button
id="loginBtn"
class="loginBtn"
onclick="loginGoogle()">

Entrar com Google

</button>

<!-- PERFIL -->

<div
id="profile"
class="profile"
style="display:none;">

<img
id="userPhoto"
class="userPhoto">

<div id="userName">
Usuário
</div>

<button
class="logoutBtn"
onclick="logout()">

Sair

</button>

</div>

<!-- HISTORICO -->

<div
id="historyList"
class="historyList">

</div>

</div>

<!-- MAIN -->

<div class="main">

<!-- CHAT -->

<div
id="chat"
class="chat">

<div class="welcome">

<h1>
Rainbow AI 🌈
</h1>

<p>
Sua IA inteligente
</p>

</div>

</div>

<!-- INPUT -->

<div class="inputArea">

<input

id="messageInput"

type="text"

placeholder="Digite sua mensagem..."

>

<button
class="sendBtn"
onclick="sendMessage()">

Enviar

</button>

</div>

</div>

<!-- FIREBASE -->

<script src="firebase.js"></script>

<!-- SCRIPT -->

<script src="script.js"></script>

</body>
</html>
